name: CI
on:
  pull_request:
permissions:
  contents: write
  pull-requests: write
jobs:
  ci:
    # The template itself has no lockfile and its __DATASET__ dependency does
    # not resolve, so npm ci cannot succeed here. Websites created from the
    # template have a different repository name and do run these checks.
    if: ${{ !endsWith(github.repository, '/website-template') }}
    uses: museumwithnofrontiers/viewer-workflows/.github/workflows/website-ci.yml@v1.9.0
  locales:
    uses: museumwithnofrontiers/viewer-workflows/.github/workflows/locale-validate.yml@v1.9.0
