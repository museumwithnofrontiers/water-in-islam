name: Deploy
on:
  push:
    branches: [main]
  # Started by website-text-deploy.yml after a text-only merge; see ci.yml.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # Nothing to deploy from the template itself - see ci.yml.
    if: ${{ !endsWith(github.repository, '/website-template') }}
    uses: museumwithnofrontiers/viewer-workflows/.github/workflows/website-deploy-pages.yml@v1.10.0
