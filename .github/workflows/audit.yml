name: Scheduled audit
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    # Nothing to audit from the template itself - see ci.yml.
    if: ${{ !endsWith(github.repository, '/website-template') }}
    uses: museumwithnofrontiers/viewer-workflows/.github/workflows/audit-scheduled.yml@v1.9.0
